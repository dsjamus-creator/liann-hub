name: HUB Android app

# Builds the LiANN HUB Android app (a Trusted Web Activity that opens https://app.lwliann.com) in the cloud.
# It always makes a debug APK for testing. If the owner has added the release signing secrets below, it also makes a
# signed release APK and an Android App Bundle for Google Play. Nothing is published anywhere: files are workflow artifacts.
#   HUB_ANDROID_KEYSTORE_B64        the release keystore, base64 encoded
#   HUB_ANDROID_KEYSTORE_PASSWORD   its store password
#   HUB_ANDROID_KEY_ALIAS           the key alias
#   HUB_ANDROID_KEY_PASSWORD        the key password
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/liann-hub-android/**
      - .github/workflows/hub-android.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_RELEASE_KEY: ${{ secrets.HUB_ANDROID_KEYSTORE_B64 != '' && secrets.HUB_ANDROID_KEYSTORE_PASSWORD != '' && secrets.HUB_ANDROID_KEY_ALIAS != '' && secrets.HUB_ANDROID_KEY_PASSWORD != '' }}
    defaults:
      run:
        working-directory: apps/liann-hub-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build the debug APK
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Name and checksum the debug APK
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -n "$version"
          mkdir -p dist
          name="LiANN-HUB-Android-$version-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS-debug.txt)
          echo "Built $name: $(stat -c '%s' "dist/$name") bytes; $(cut -d ' ' -f 1 dist/SHA256SUMS-debug.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: liann-hub-android-debug
          path: apps/liann-hub-android/dist/
          if-no-files-found: error
      - name: Build the signed release APK and App Bundle
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HUB_ANDROID_KEYSTORE_B64 }}
          HUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HUB_ANDROID_KEYSTORE_PASSWORD }}
          HUB_ANDROID_KEY_ALIAS: ${{ secrets.HUB_ANDROID_KEY_ALIAS }}
          HUB_ANDROID_KEY_PASSWORD: ${{ secrets.HUB_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hub-release.keystore"
          export HUB_ANDROID_KEYSTORE="$RUNNER_TEMP/hub-release.keystore"
          bash ./gradlew assembleRelease bundleRelease --no-daemon
          version=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk "dist-release/LiANN-HUB-Android-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist-release/LiANN-HUB-Android-$version.aab"
          (cd dist-release && sha256sum *.apk *.aab > SHA256SUMS.txt)
          keytool -list -v -keystore "$HUB_ANDROID_KEYSTORE" -alias "$HUB_ANDROID_KEY_ALIAS" -storepass "$HUB_ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA256:' | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY"
          rm -f "$HUB_ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: liann-hub-android-release
          path: apps/liann-hub-android/dist-release/
          if-no-files-found: error
