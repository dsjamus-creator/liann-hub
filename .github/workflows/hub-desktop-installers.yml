name: HUB desktop installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/liann-hub-desktop/**
      - .github/workflows/hub-desktop-installers.yml

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/liann-hub-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/liann-hub-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        if: matrix.command == 'dist:win'
        run: npm run dist:win
      - name: Build Intel and Apple silicon Mac installers
        if: matrix.command == 'dist:mac'
        run: npm run dist:mac -- --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: matrix.command == 'dist:win'
        with:
          name: liann-hub-windows-installer
          path: apps/liann-hub-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: matrix.command == 'dist:mac'
        with:
          name: liann-hub-mac-dmg
          path: apps/liann-hub-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
