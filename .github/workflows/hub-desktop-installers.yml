name: HUB desktop installers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/liann-hub-desktop/**
      - .github/workflows/hub-desktop-installers.yml

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/liann-hub-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/liann-hub-desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        if: matrix.command == 'dist:win'
        run: npm run dist:win
      - name: Build Intel and Apple silicon Mac installers
        if: matrix.command == 'dist:mac'
        run: npm run dist:mac -- --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        if: matrix.command == 'dist:win'
        with:
          name: liann-hub-windows-installer
          path: apps/liann-hub-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: matrix.command == 'dist:mac'
        with:
          name: liann-hub-mac-dmg
          path: apps/liann-hub-desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  # Hand-started runs only: gather the three installers into one DRAFT pre-release (visible only to people with write
  # access) with a checksum file, so the owner can inspect them. Nothing is published to learners by this job; public
  # files go to the downloads bucket under the immutable-key rule in lwl-backend docs/LIANN-DOWNLOADS.md.
  draft-release:
    if: github.event_name == 'workflow_dispatch'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: liann-hub-windows-installer
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: liann-hub-mac-dmg
          path: dist
      - name: Checksum and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum LiANN-HUB-Setup-*.exe LiANN-HUB-*-x64.dmg LiANN-HUB-*-arm64.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          version=$(ls dist/LiANN-HUB-Setup-*.exe | sed -n 's/.*Setup-\(.*\)\.exe/\1/p')
          test -n "$version"
          printf 'Unsigned preview installers for LiANN HUB %s from commit %s. Windows may show a SmartScreen warning; on a Mac, open the disk image from the context menu the first time.\n' "$version" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "hub-desktop-v$version-$GITHUB_RUN_ID" dist/*.exe dist/*.dmg dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "LiANN HUB $version installers (preview, run $GITHUB_RUN_ID)" --notes-file "$RUNNER_TEMP/notes.md"
